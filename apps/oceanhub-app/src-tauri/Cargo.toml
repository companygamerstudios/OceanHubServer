[package]
name = "oceanhub_app"
version = "3.0.2"
description = "OceanHub Android mobile application"
authors = ["COMPANY GAMER STUDIOS"]
edition = "2021"

[lib]
name = "oceanhub_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "=2.8.1"
tauri-plugin-fcm = "=0.2.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Keep installable CI APKs small while retaining debuggable Rust behavior.
[profile.dev]
debug = 0
strip = "debuginfo"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.0.0"
