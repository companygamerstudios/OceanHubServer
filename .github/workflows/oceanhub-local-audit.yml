name: Ocean Hub local audit

on:
  push:
    branches:
      - "audit/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run local source and crypto tests
        run: npm test
