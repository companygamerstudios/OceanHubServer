name: OceanHub Native build validation

on:
  push:
    branches: ["feat/oceanhub-3-native-app-shell"]
    paths:
      - "apps/oceanhub-app/**"
      - ".github/workflows/oceanhub-native-validation.yml"
  pull_request:
    branches: ["main", "feat/oceanhub-3-download-center"]
    paths:
      - "apps/oceanhub-app/**"
      - ".github/workflows/oceanhub-native-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oceanhub-native-validation-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  windows-test-installers:
    name: Windows unsigned installer validation
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/oceanhub-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/oceanhub-app/src-tauri -> target
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Build unsigned Windows installers
        run: npm run tauri:build -- --no-sign --bundles nsis
      - name: Upload Windows test installers
        uses: actions/upload-artifact@v4
        with:
          name: oceanhub-windows-unsigned-test
          path: apps/oceanhub-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  android-debug-apk:
    name: Android debug APK validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/oceanhub-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK, Build Tools and NDK
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Set up stable Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/oceanhub-app/src-tauri -> target
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Initialize Tauri Android project
        run: npm run tauri:android:init -- --ci
      - name: Configure public repositories for generated Android buildSrc
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, access } from 'node:fs/promises';

          const candidates = [
            'src-tauri/gen/android/buildSrc/build.gradle.kts',
            'src-tauri/gen/android/buildSrc/build.gradle'
          ];
          let patched = false;
          for (const file of candidates) {
            try { await access(file); } catch { continue; }
            let source = await readFile(file, 'utf8');
            if (!/repositories\s*\{/.test(source)) {
              source += '\nrepositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()\n}\n';
            } else {
              source = source.replace(/repositories\s*\{/, (block) => {
                const lines = [];
                if (!/\bgoogle\(\)/.test(source)) lines.push('    google()');
                if (!/\bmavenCentral\(\)/.test(source)) lines.push('    mavenCentral()');
                return lines.length ? block + '\n' + lines.join('\n') : block;
              });
            }
            await writeFile(file, source);
            console.log('Configured Google Maven + Maven Central in ' + file);
            patched = true;
          }
          if (!patched) throw new Error('Generated Android buildSrc Gradle file was not found.');
          NODE
      - name: Build arm64 debug APK
        run: npm run tauri:android:build -- --debug --target aarch64 --ci
      - name: Verify APK output exists
        shell: bash
        run: |
          find src-tauri/gen/android/app/build/outputs -type f -name "*.apk" -print
          test -n "$(find src-tauri/gen/android/app/build/outputs -type f -name "*.apk" -print -quit)"
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oceanhub-android-arm64-debug-test
          path: apps/oceanhub-app/src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 7
