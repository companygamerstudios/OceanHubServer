name: OceanHub Windows desktop build validation

on:
  push:
    branches: ["main", "feat/oceanhub-five-phase-execution"]
    paths:
      - "apps/oceanhub-app/**"
      - ".github/workflows/oceanhub-windows-validation.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/oceanhub-app/**"
      - ".github/workflows/oceanhub-windows-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oceanhub-windows-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows desktop executable build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/oceanhub-app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Windows platform icon
        run: npm run icons:windows
      - name: Build Windows desktop package
        run: npm run tauri:build
      - name: Upload Windows app executable
        uses: actions/upload-artifact@v7
        with:
          path: |
            apps/oceanhub-app/src-tauri/target/release/oceanhub_app.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
